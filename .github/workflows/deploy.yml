name: Deploy to GitHub Pages

on:
  release:
    types:
      - published

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Production releases require a vMAJOR.MINOR.PATCH tag; got: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test -- --run

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build
        env:
          # Signaling server configuration (required for P2P collaboration)
          VITE_SIGNALING_SERVER_URL: ${{ secrets.VITE_SIGNALING_SERVER_URL }}
          VITE_SIGNALING_SERVER_TOKEN: ${{ secrets.VITE_SIGNALING_SERVER_TOKEN }}
          # TURN server configuration (required for WebRTC NAT traversal)
          VITE_TURN_PASSWORD: ${{ secrets.VITE_TURN_PASSWORD }}
          # File server configuration (required for file upload/download)
          VITE_FILE_SERVER_URL: ${{ secrets.VITE_FILE_SERVER_URL }}
          # Debug mode (optional - defaults to .env.production value if not set)
          # To enable debug in production, add VITE_DEBUG secret with value "true"
          VITE_DEBUG: ${{ secrets.VITE_DEBUG }}
          # Immutable release identity exposed in the footer and /version.json
          VITE_APP_VERSION: ${{ github.event.release.tag_name }}
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_RELEASE_URL: ${{ github.event.release.html_url }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
