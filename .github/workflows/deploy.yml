name: Deploy to GitHub Pages

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: ${{ (github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'web-v')) || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && startsWith(github.ref_name, 'web-v')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
          fetch-depth: 0

      - name: Verify release commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main; then
            echo "Web production tags must point to a commit reachable from main" >&2
            exit 1
          fi

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^web-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Web production releases require a web-vMAJOR.MINOR.PATCH tag; got: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "VITE_APP_VERSION=${RELEASE_TAG#web-}" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "VITE_RELEASE_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test -- --run

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build
        env:
          # Signaling server configuration (required for P2P collaboration)
          VITE_SIGNALING_SERVER_URL: ${{ secrets.VITE_SIGNALING_SERVER_URL }}
          VITE_SIGNALING_SERVER_TOKEN: ${{ secrets.VITE_SIGNALING_SERVER_TOKEN }}
          # TURN server configuration (required for WebRTC NAT traversal)
          VITE_TURN_PASSWORD: ${{ secrets.VITE_TURN_PASSWORD }}
          # File server configuration (required for file upload/download)
          VITE_FILE_SERVER_URL: ${{ secrets.VITE_FILE_SERVER_URL }}
          # Debug mode (optional - defaults to .env.production value if not set)
          # To enable debug in production, add VITE_DEBUG secret with value "true"
          VITE_DEBUG: ${{ secrets.VITE_DEBUG }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
