name: Release Desktop App

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Validate immutable release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Desktop releases require a desktop-vMAJOR.MINOR.PATCH tag; got: $RELEASE_TAG" >&2
            exit 1
          fi

          RELEASE_VERSION="${RELEASE_TAG#desktop-v}"
          CONFIG_VERSION="$(node -e "const fs = require('fs'); const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')); process.stdout.write(config.version)")"
          if [[ "$RELEASE_VERSION" != "$CONFIG_VERSION" ]]; then
            echo "Tag version $RELEASE_VERSION does not match src-tauri/tauri.conf.json version $CONFIG_VERSION" >&2
            exit 1
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'gdsjam Desktop v${{ steps.release.outputs.version }}'
          releaseBody: |
            ## gdsjam Desktop App v${{ steps.release.outputs.version }}
            
            Download the appropriate installer for your platform:
            - **macOS (Apple Silicon)**: `gdsjam_${{ steps.release.outputs.version }}_aarch64.dmg`
            - **macOS (Intel)**: `gdsjam_${{ steps.release.outputs.version }}_x64.dmg`
            - **Windows**: `gdsjam_${{ steps.release.outputs.version }}_x64-setup.exe` or `.msi`
            - **Linux**: `.deb`, `.rpm`, or `.AppImage`
            
            ### Features
            - Native file picker with path persistence
            - Automatic file watching and reload
            - All web features (GDS/DXF viewing, collaboration, etc.)
            
            See the [README](https://github.com/jwt625/gdsjam#desktop-app) for more details.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
